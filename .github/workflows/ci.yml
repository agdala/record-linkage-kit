name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar o projeto
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -v
      - name: make run (dados sintéticos, do zero)
        run: make run
      - name: Conferir que as métricas versionadas são as reproduzidas (números do README)
        run: git diff --exit-code -- reports/metricas.json reports/relatorio.html
